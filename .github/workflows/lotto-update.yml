name: Update Lao Santipap Latest 3

on:
  schedule:
    # ทุกวัน 18:35 TH  (11:35 UTC)
    - cron: "35 11 * * *"

    # จันทร์-ศุกร์ 20:35 TH (13:35 UTC)
    - cron: "35 13 * * 1-5"

    # พุธ/เสาร์/อาทิตย์ 19:00 TH (12:00 UTC)
    - cron: "0 12 * * 3,6,0"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: lotto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Run updater
        run: node scripts/update_lao_santipap_latest3.mjs

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: update lotto json"
          git push
